- title: "3D Modeling"
  description: "Stills and video renders of some 3D modeled scenes. Intro to 3D Modeling Course. Done in Maya."
  items:
    - type: image
      title: "Nixie tube lamp device."
      path: "/assets/img/nixie_tube.png"
      description: "A 3D render of a single numeric digit nixie tube on a wooden box placed on a table in a dimly lit environment. The digit 2 is illuminated. A spare tube can be seen to the left."
    - type: image
      title: "Decaying room in the ruins of Gunkanjima (Hashima Island). Modelled after a photo."
      path: "/assets/img/room_haikyo.png"
      description: "A 3D render of a decaying room with a sunset visible through the balcony. Wooden beams, broken ceramics and the remains of door panels litter the floor."

