remote_theme: "cquanze/jekyll-theme-maw"

title: "Quan Ze Chen"
description: "Personal web site and profile page of Quan Ze Chen"
keywords: ["Quan Ze Chen", "Quanze Chen", "cqz", "cquanze", "resume", "CV", "homepage", "personal website", "portfolio"]

author:
  name: "Quan Ze Chen"
  position: "Postdoctoral Researcher"
  affiliation: "AI & Democracy Foundation"
  email: "me (at) [domain]"
  image:
    path: "/assets/img/qr.png"
    alt: "QR Code"

footer:
  show-theme-source: true

# Where to pull assets from
assets:
  dirname: assets
  baseurl: /assets/
  sources:
    - assets

# Collections
collections:
  publications:
    output: true
    permalink: /publications/:year/:title/
  projects:
    output: true
    permalink: /project/:name/
  portfolio:
    output: true
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: portfolio
    values:
      layout: portfolio-item

# Plugins
plugins:
  - jekyll-sitemap
