  portfolio-links:
    - type: artstation
      url: https://artstation.com/
    - type: deviantart
      url: https://deviantart.com/

  ## Links to social media
  # Supported types: twitter, github, bluesky, linkedin, instagram
  socials:
    - type: twitter
      handle: cquanze
    - type: github
      handle: cquanze
    - type: linkedin
      handle: cquanze
    - type: bluesky
